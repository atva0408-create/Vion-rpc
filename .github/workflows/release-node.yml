name: Release Node

on:
  push:
    tags:
      - "node-v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/test.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # ViON packages are published to the self-hosted registry (deploy/npm-registry in VIONN)
          registry-url: "${{ vars.NPM_REGISTRY_URL || 'https://npm.vionvision.tech' }}"

      - name: Verify tag matches node/package.json version
        run: |
          TAG="${GITHUB_REF_NAME#node-v}"
          PKG="$(node -p "require('./node/package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match node/package.json version $PKG"
            exit 1
          fi

      - name: Install & build
        run: |
          npm ci
          npm ci --prefix node
          npm --prefix node run build

      - name: Publish to npm
        env:
          # publish token for the ViON registry (Verdaccio user with publish rights)
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11.18.0
          cd node && npm publish --access public
